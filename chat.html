<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Asisten BBSPGL</title>
    <style>
      body {
        background: #f6f8fa;
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .chat-container {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        width: 400px;
        max-width: 95vw;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        background: #002a5c;
        color: #fff;
        padding: 14px 18px;
        font-weight: 600;
        font-size: 16px;
      }
      .chat-window {
        flex: 1;
        padding: 18px 12px;
        overflow-y: auto;
        background: #f3f5f7;
        min-height: 320px;
        max-height: 400px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-msg {
        padding: 10px 14px;
        border-radius: 16px;
        max-width: 80%;
        word-break: break-word;
        font-size: 15px;
        line-height: 1.5;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .chat-msg.user {
        background: linear-gradient(90deg, #e0e7ff 60%, #c7d2fe 100%);
        align-self: flex-end;
        color: #2d3748;
      }
      .chat-msg.bot {
        background: linear-gradient(90deg, #fef9c3 60%, #fde68a 100%);
        align-self: flex-start;
        color: #7c4700;
      }
      .chat-form {
        display: flex;
        border-top: 1px solid #e5e7eb;
        background: #fff;
        padding: 10px;
      }
      .chat-form input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        font-size: 15px;
        outline: none;
        margin-right: 8px;
        transition: border 0.2s;
      }
      .chat-form input[type="text"]:focus {
        border-color: #6366f1;
      }
      .chat-form button {
        background: #002a5c;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 0 18px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .chat-form button:hover {
        background: #003d7a;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">🌊 Asisten BBSPGL</div>
      <div id="chat-window" class="chat-window">
        <div class="chat-msg bot">
          Halo! Selamat datang di layanan informasi BBSPGL. Ada yang bisa saya
          bantu?
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Ketik pesan..."
          autocomplete="off"
          required
        />
        <button type="submit">Kirim</button>
      </form>
    </div>
    <!-- Panggil file logika JavaScript -->
    <script src="chatbot.js"></script>
  </body>
</html>
